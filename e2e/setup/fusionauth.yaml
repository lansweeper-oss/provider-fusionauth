apiVersion: v1
kind: Namespace
metadata:
  name: fusionauth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: fusionauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:18-bookworm
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: fusionauth
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: fusionauth
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fusionauth-logback
  namespace: fusionauth
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration scan="true" scanPeriod="60 seconds">
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{"MMM dd, yyyy h:mm:ss.SSS a"} %-5level %logger{75} - %msg%n</pattern>
        </encoder>
      </appender>
      <logger name="io.fusionauth" level="DEBUG" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.primeframework" level="INFO" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="com.inversoft.migration" level="INFO" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="com.inversoft.maintenance" level="INFO" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.apache.kafka.common.utils.AppInfoParser" level="ERROR" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.apache.kafka.clients.consumer.ConsumerConfig" level="ERROR" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.apache.kafka.clients.producer.ProducerConfig" level="ERROR" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.apache.kafka.clients.producer.KafkaProducer" level="ERROR" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <logger name="org.apache.kafka.clients.NetworkClient" level="ERROR" additivity="false">
        <appender-ref ref="STDOUT"/>
      </logger>
      <root level="INFO">
        <appender-ref ref="STDOUT"/>
      </root>
    </configuration>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fusionauth-kickstart
  namespace: fusionauth
data:
  kickstart.json: |
    {
      "apiKeys": [
        {
          "key": "e2e-test-api-key-00000000000000000000",
          "description": "E2E test superuser key"
        }
      ],
      "requests": []
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusionauth
  namespace: fusionauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fusionauth
  template:
    metadata:
      labels:
        app: fusionauth
    spec:
      containers:
        - name: fusionauth
          image: fusionauth/fusionauth-app:1.69.2
          env:
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgresql.fusionauth.svc.cluster.local:5432/fusionauth"
            - name: DATABASE_ROOT_USERNAME
              value: postgres
            - name: DATABASE_ROOT_PASSWORD
              value: postgres
            - name: DATABASE_USERNAME
              value: postgres
            - name: DATABASE_PASSWORD
              value: postgres
            - name: FUSIONAUTH_APP_MEMORY
              value: "256M"
            - name: SEARCH_TYPE
              value: database
            - name: FUSIONAUTH_APP_KICKSTART_FILE
              value: /kickstart/kickstart.json
            - name: FUSIONAUTH_APP_RUNTIME_MODE
              value: development
            - name: FUSIONAUTH_ADDITIONAL_JAVA_ARGS
              value: "-Dlogback.configurationFile=/config/logback.xml"
          ports:
            - containerPort: 9011
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 9011
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: kickstart
              mountPath: /kickstart
            - name: logback
              mountPath: /config
      volumes:
        - name: kickstart
          configMap:
            name: fusionauth-kickstart
        - name: logback
          configMap:
            name: fusionauth-logback
---
apiVersion: v1
kind: Service
metadata:
  name: fusionauth
  namespace: fusionauth
spec:
  selector:
    app: fusionauth
  ports:
    - port: 9011
      targetPort: 9011
