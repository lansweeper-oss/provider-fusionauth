apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: group-create-cluster
# Validates basic Group CRUD lifecycle for cluster-scoped resources
# (fusionauth.crossplane.io). Creates a Group, asserts Ready, then cleans up.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: create-group
      try:
        - apply:
            resource:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Group
              metadata:
                name: e2e-test-group
              spec:
                forProvider:
                  name: e2e-test-group
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Group
              metadata:
                name: e2e-test-group
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        - delete:
            ref:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Group
              name: e2e-test-group
