apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: email-create-cluster
# Validates basic Email template CRUD lifecycle for cluster-scoped resources
# (fusionauth.crossplane.io). Creates an Email, asserts Ready, then cleans up.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: create-email
      try:
        - apply:
            resource:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Email
              metadata:
                name: e2e-test-email
                labels:
                  e2e-test: "true"
              spec:
                forProvider:
                  name: e2e-test-email
                  defaultHtmlTemplate: "<p>Test</p>"
                  defaultSubject: "Test"
                  defaultTextTemplate: "Test"
                  defaultFromName: "Test"
                providerConfigRef:
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Email
              metadata:
                name: e2e-test-email
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        - delete:
            ref:
              apiVersion: fusionauth.crossplane.io/v1alpha1
              kind: Email
              name: e2e-test-email
