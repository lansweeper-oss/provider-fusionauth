apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: webhook-create-namespaced
# Validates basic Webhook CRUD lifecycle for namespaced resources
# (fusionauth.m.crossplane.io). Creates a Webhook using ClusterProviderConfig,
# asserts Ready, then cleans up.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: create-webhook
      try:
        - apply:
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Webhook
              metadata:
                name: e2e-ns-test-webhook
              spec:
                forProvider:
                  connectTimeout: 1000
                  readTimeout: 2000
                  url: "https://example.com/webhook"
                  eventsEnabled:
                    - userCreate: true
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Webhook
              metadata:
                name: e2e-ns-test-webhook
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        - delete:
            ref:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Webhook
              name: e2e-ns-test-webhook
