apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: role-with-application-namespaced
# Validates Role creation with an Application dependency for namespaced
# resources. Role (application.fusionauth.m.crossplane.io) requires
# applicationId, so we create an Application first, extract its ID, then
# create the Role.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: create-application
      try:
        - apply:
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Application
              metadata:
                name: role-test-ns-app
              spec:
                forProvider:
                  name: role-test-ns-app
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Application
              metadata:
                name: role-test-ns-app
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: create-role
      try:
        - script:
            timeout: 30s
            content: |
              APP_ID=$(${KUBECTL} get application.fusionauth.m.crossplane.io role-test-ns-app \
                -o jsonpath='{.status.atProvider.id}')
              cat <<EOF | ${KUBECTL} apply -f -
              apiVersion: application.fusionauth.m.crossplane.io/v1alpha1
              kind: Role
              metadata:
                name: e2e-test-ns-role
              spec:
                forProvider:
                  applicationId: "${APP_ID}"
                  description: "E2E test role namespaced"
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
              EOF
        - assert:
            timeout: 5m
            resource:
              apiVersion: application.fusionauth.m.crossplane.io/v1alpha1
              kind: Role
              metadata:
                name: e2e-test-ns-role
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        - delete:
            ref:
              apiVersion: application.fusionauth.m.crossplane.io/v1alpha1
              kind: Role
              name: e2e-test-ns-role
        - delete:
            ref:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Application
              name: role-test-ns-app
