apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lambda-create-namespaced
# Validates basic Lambda CRUD lifecycle for namespaced resources
# (fusionauth.m.crossplane.io). Creates a Lambda using ClusterProviderConfig,
# asserts Ready, then cleans up.
spec:
  timeouts:
    delete: 5m
    cleanup: 5m
  steps:
    - name: create-lambda
      try:
        - apply:
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Lambda
              metadata:
                name: e2e-ns-test-lambda
              spec:
                forProvider:
                  name: e2e-ns-test-lambda
                  type: JWTPopulate
                  body: "function populate(jwt, user, registration) { }"
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
        - assert:
            timeout: 5m
            resource:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Lambda
              metadata:
                name: e2e-ns-test-lambda
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
      finally:
        - delete:
            ref:
              apiVersion: fusionauth.m.crossplane.io/v1alpha1
              kind: Lambda
              name: e2e-ns-test-lambda
