        argumentDocs:
            access_control_configuration: '- (Optional)'
            access_token_key_id: '- (Optional) The unique id of the signing key used to sign the access token. Required prior to 1.30.0.'
            access_token_verification_key_ids: '- (Optional) The list of access token verification key Ids that are trusted by this tenant. access_token_key_id is implicitly included in this list and does not need to be explicitly specified. If access_token_key_id is changed to a new key and the old key is supplied in this field, then this facilitates key rotation because FusionAuth will trust JWTs signed by both keys, while only signing JWTs with the new key. Requires FusionAuth 1.69.0 or later.'
            action_cancel_policy_on_password_reset: '- (Optional) Indicates whether you want the user to be able to self-service unlock their account prior to the action duration by completing a password reset workflow.'
            action_duration: '- (Required) The duration of the User Action. This value along with the actionDurationUnit will be used to set the duration of the User Action. Value must be greater than 0.'
            action_duration_unit: '- (Optional) The unit of time associated with a duration.'
            additional_headers: '- (Optional) The additional SMTP headers to be added to each outgoing email. Each SMTP header consists of a name and a value.'
            admin_two_factor_method_remove_email_template_id: '- (Optional) The Id of the Email Template used to send emails to administrators when a MFA method has been removed from a user account.'
            admin_two_factor_method_remove_template_id: '- (Optional) The Id of the Message Template used to send a message to administrators when a MFA method has been removed from a user account.'
            admin_user_form_id: '- (Optional) The unique Id of the form to use for the Add and Edit User form when used in the FusionAuth admin UI.'
            allow_access_token_bootstrap: '- (Optional) When enabled, an SSO session can be created after login by providing an access token as a bearer token in a request to the OAuth2 Authorize endpoint. Defaults to false.'
            allow_child_registrations: '- (Optional) Whether to allow child registrations.'
            allow_email_change_when_gated: '- (Optional) When this value is set to true, the user is allowed to change their email address when they are gated because they haven’t verified their email address.'
            allow_phone_number_change_when_gated: '- (Optional) When this value is set to true, the user is allowed to change their phone number when they are gated because they haven''t verified their phone number. Defaults to false.'
            authenticator: '- (Optional)'
            authenticator_attachment_preference: '- (Optional) Determines the authenticator attachment requirement for WebAuthn passkey registration when using the bootstrap workflow. The possible values are: Any, CrossPlatform and Platform. Note: A license is required to utilize WebAuthn and an Enterprise plan is required to utilize WebAuthn cross-platform authenticators..'
            authorization_grant_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a OAuth authorization code in no longer valid to be exchanged for an access token. This is essentially the time allowed between the start of an Authorization request during the Authorization code grant and when you request an access token using this authorization code on the Token endpoint. Defaults to 30.'
            base_url: '- (Optional) The default base URL used when rendering links in email and message templates for this tenant. Used when the application''s base_url is not defined. Available in FusionAuth 1.68.0 and later.'
            behavior: '- (Optional) The desired behavior during login for a user that does not have a verified email. The possible values are: Allow - the user will be allowed to complete login; Gated - verification is required before a user can complete login. The use of Gated requires a paid plan. Defaults to Allow.'
            blocked_domains: '- (Optional) A list of unique domains that are not allowed to register when self service is enabled.'
            blocklisted_ip: '- (Optional) Checks whether the client''s IP address appears on a blocklist. Defaults to true.'
            bootstrap_workflow: '- (Optional) The Bootstrap Workflow configuration.'
            bot_detected: '- (Optional) Detects bot interactions with the browser window. Defaults to true.'
            breach_detection: '- (Optional)'
            captcha_configuration: '- (Optional)'
            captcha_method: '- (Optional) The type of captcha method to use. This field is required when tenant.captchaConfiguration.enabled is set to true.'
            change_password_id_generator: '- (Optional)'
            change_password_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a change password Id is no longer valid and cannot be used by the Change Password API. Value must be greater than 0. Defaults to 600.'
            client_credentials_access_token_populate_lambda_id: '- (Optional) The Id of a lambda that will be called to populate the JWT during a client credentials grant. Note: A paid edition of FusionAuth is required to utilize client credentials grant.'
            client_entity_type_id: '- (Required) The Entity Type that will be used to represent SCIM Clients for this tenant. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            client_risk_configuration: '- (Optional) Flags to enable or disable specific risk signals that contribute to the composite client risk calculation used by Intelligent MFA. Available since FusionAuth 1.68.0.'
            confirm_child_email_template_id: '- (Optional) The unique Id of the email template to use when confirming a child.'
            connector_id: '- (Optional) The identifier of the Connector to which this policy refers.'
            connector_policy: '- (Optional) A list of Connector policies. Users will be authenticated against Connectors in order. Each Connector can be included in this list at most once and must exist.'
            count: '- (Optional) The number of previous passwords to remember. Value must be greater than 0.'
            data: '- (Optional) A JSON string that can hold any information about the Tenant that should be persisted.'
            days: '- (Optional) The password maximum age in days. The number of days after which FusionAuth will require a user to change their password. Required when systemConfiguration.maximumPasswordAge.enabled is set to true.'
            debug: '- (Optional) Determines if debug should be enabled to create an event log to assist in debugging SMTP errors.'
            default_from_email: '- (Optional) The default email address that emails will be sent from when a from address is not provided on an individual email template. This is the address part email address (i.e. Jared Dunn jared@piedpiper.com).'
            default_from_name: '- (Optional) The default From Name used in sending emails when a from name is not provided on an individual email template. This is the display name part of the email address ( i.e. Jared Dunn jared@piedpiper.com).'
            delete_orphaned_accounts: '- (Optional) Indicates that child users without parental verification will be permanently deleted after tenant.familyConfiguration.deleteOrphanedAccountsDays days.'
            delete_orphaned_accounts_days: '- (Optional) The number of days from creation child users will be retained before being deleted for not completing parental verification. Value must be greater than 0.'
            device_code_time_to_live_in_seconds: '- (Optional) The time in seconds until a device code Id is no longer valid and cannot be used by the Token API. Value must be greater than 0. Defaults to 300.'
            device_trust_time_to_live_in_seconds: '- (Optional) The number of seconds before a trusted device is reset. When reset, a user is forced to complete captcha during login and complete two factor authentication if applicable.'
            device_user_code_id_generator: '- (Optional)'
            disallow_user_login_id: '- (Optional) If enabled, passwords will be rejected if they contain the user''s email, username, or phone number.'
            domains: '- (Optional) A list of email domains to which this connector should apply. A value of ["*"] indicates this connector applies to all users.'
            dormant_account: '- (Optional) Checks if the user has not logged in for a long period of time. Defaults to true.'
            dormant_password: '- (Optional) Checks if the user''s password has not been changed for a long period of time. Defaults to true.'
            email: '- (Optional)'
            email_configuration: '- (Optional) The email configuration for the tenant.'
            email_update_email_template_id: '- (Optional) The Id of the Email Template that is used when a user is sent a forgot password email.'
            email_user: '- (Optional) Indicates you would like to email the user when the user’s account is locked due to this action being taken. This requires the User Action specified by the tenant.failedAuthenticationConfiguration.userActionId to also be configured for email. If the User Action is not configured to be able to email the user, this configuration will be ignored.'
            email_verification_id_generator: '- (Optional)'
            email_verification_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a email verification Id is no longer valid and cannot be used by the Verify Email API. Value must be greater than 0.'
            email_verification_one_time_code_generator: '- (Optional)'
            email_verified_email_template_id: '- (Optional) The Id of the Email Template used to verify user emails.'
            enabled: '- (Optional) Whether captcha configuration is enabled.'
            encryption_scheme: '- (Optional) The default method for encrypting the User’s password.'
            encryption_scheme_factor: '- (Optional) The factor used by the password encryption scheme. If not provided, the PasswordEncryptor provides a default value. Generally this will be used as an iteration count to generate the hash. The actual use of this value is up to the PasswordEncryptor implementation.'
            event: '- (Optional) The event type'
            event_configuration: '- (Optional)'
            external_authentication_id_time_to_live_in_seconds: '- (Optional) The time in seconds until an external authentication Id is no longer valid and cannot be used for external authentication. Value must be greater than 0.'
            external_identifier_configuration: '- (Optional)'
            failed_authentication_configuration: '- (Optional)'
            failed_login: '- (Optional)'
            family_configuration: '- (Optional)'
            family_request_email_template_id: '- (Optional) The unique Id of the email template to use when a family request is made.'
            forgot_password: '- (Optional)'
            forgot_password_email_template_id: '- (Optional) The Id of the Email Template that is used when a user is sent a forgot password email.'
            forgot_password_template_id: '- (Optional) The Id of the Message Template that is used when sending a user a forgot password message.'
            form_configuration: '- (Optional)'
            host: '- (Optional) The host name of the SMTP server that FusionAuth will use.'
            http_session_max_inactive_interval: '- (Optional) Time in seconds until an inactive session will be invalidated. Used when creating a new session in the FusionAuth OAuth frontend.'
            id_token_key_id: '- (Optional) The unique id of the signing key used to sign the Id token. Required prior to 1.30.0.'
            id_token_verification_key_ids: '- (Optional) The list of Id token verification key Ids that are trusted by this tenant. id_token_key_id is implicitly included in this list and does not need to be explicitly specified. If id_token_key_id is changed to a new key and the old key is supplied in this field, then this facilitates key rotation because FusionAuth will trust JWTs signed by both keys, while only signing JWTs with the new key. Requires FusionAuth 1.69.0 or later.'
            identity_provider_connection_test_time_to_live_in_seconds: '- (Optional) The time in seconds until an identity provider connection test Id is no longer valid and cannot be used by the Identity Provider Test API. Value must be greater than 0.'
            identity_update_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when their phone number has been updated. The message will be sent to both their new and old phone numbers.'
            implicit_email_verification_allowed: '- (Optional) When set to true, this allows email to be verified as a result of completing a similar email based workflow such as change password. When seto false, the user must explicitly complete the email verification workflow even if the user has already completed a similar email workflow such as change password.'
            implicit_phone_verification_allowed: '- (Optional) When set to true, this allows a phone number to be verified as a result of completing a similar phone based workflow. When set to false, the user must explicitly complete the phone verification workflow.'
            impossible_travel: '- (Optional) Flags a login as high risk if it occurs sooner than it would take to physically travel from the previous login location to the current one. Defaults to true.'
            issuer: '- (Optional) The named issuer used to sign tokens, this is generally your public fully qualified domain.'
            jwt_configuration: '- (Optional) The JWT configuration for the tenant.'
            lambda_configuration: '- (Optional) Lambda configuration for this tenant.'
            length: '- (Optional) The length of the secure generator used for generating the change password Id. Defaults to 32.'
            limit: '-  (Optional) The number of times a user can fail to login within the configured time_period_in_seconds duration. If a Failed authentication action has been configured then it will take precedence.'
            login_configuration: ""
            login_id_in_use_on_create_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when another user attempts to create an account with their login Id.'
            login_id_in_use_on_create_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when another user attempts to create an account with their login Id.'
            login_id_in_use_on_update_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when another user attempts to create an account with their login Id.'
            login_id_in_use_on_update_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when another user attempts to update an existing account to use their login Id.'
            login_intent_time_to_live_in_seconds: '- (Optional ) The time in seconds until a Login Timeout identifier is no longer valid to complete post-authentication steps in the OAuth workflow. Must be greater than 0. Defaults to 1800.'
            login_new_device_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when they log in on a new device.'
            login_new_device_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when they log in on a new device.'
            login_policy: '- (Optional)  When set to Enabled and a user has one or more two-factor methods configured, the user will be required to complete a two-factor challenge during login. When set to Disabled, even when a user has configured one or more two-factor methods, the user will not be required to complete a two-factor challenge during login. When the login policy is to Required, a two-factor challenge will be required during login. If a user does not have configured two-factor methods, they will not be able to log in. When set to ChallengeOnMediumRisk or ChallengeOnHighRisk, a two-factor challenge is required only when the Intelligent MFA composite risk level is medium-or-higher or high, respectively (available since FusionAuth 1.68.0).'
            login_suspicious_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when a suspicious login occurs.'
            login_suspicious_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when a suspicious login using their login Id occurs.'
            login_validation_id: '- (Optional) The Id of the lambda that will be invoked at the end of a successful login request in order to extend custom validation of a login request.'
            logout_url: '- (Optional) The logout redirect URL when sending the user’s browser to the /oauth2/logout URI of the FusionAuth Front End. This value is only used when a logout URL is not defined in your Application.'
            match_mode: '- (Optional) The level of severity where Reactor will consider a breach.'
            max_length: '- (Optional) The maximum length of a password when a new user is created or a user requests a password change. This value must be greater than 0 and less than or equal to 256. When passwordEncryptionConfiguration.encryptionScheme is equal to bcrypt, the maximum will be limited to 50.'
            maximum_child_age: '- (Optional) The maximum age of a child. Value must be greater than 0.'
            maximum_password_age: '- (Optional)'
            messenger_id: '- (Optional) The messenger that is used to deliver a SMS multi-factor authentication request.'
            migrate: '- (Optional) If true, the user’s data will be migrated to FusionAuth at first successful authentication; subsequent authentications will occur against the FusionAuth datastore. If false, the Connector’s source will be treated as authoritative.'
            min_length: '- (Optional) The minimum length of a password when a new user is created or a user requests a password change.'
            minimum_owner_age: '- (Optional) The minimum age to be an owner. Value must be greater than 0.'
            minimum_password_age: '- (Optional)'
            modify_encryption_scheme_on_login: '- (Optional) When enabled a user’s hash configuration will be modified to match these configured settings. This can be useful to increase a password hash strength over time or upgrade imported users to a more secure encryption scheme after an initial import.'
            multi_factor_configuration: '- (Optional)'
            multi_factor_requirement_id: '- (Optional) The Id of the lambda that will be invoked during the login process to determine the multi-factor authentication requirements for a given user at the time of login.'
            name: '- (Required) The unique name of the Tenant.'
            notify_user_email_template_id: '- (Optional) The Id of the email template to use when notifying user of breached password. Required if tenant.passwordValidationRules.breachDetection.onLogin is set to NotifyUser.'
            number_of_digits: '- (Optional) The maximum number of digits to use when building a unique suffix for a username. A number will be randomly selected and will be 1 or more digits up to this configured value in length. For example, if this value is 5, the suffix will be a number between 00001 and 99999, inclusive.'
            oauth_configuration: '- (Optional)'
            on_login: '- (Optional) The behavior when detecting breaches at time of user login'
            one_time_password_time_to_live_in_seconds: '- (Optional) The time in seconds until a One Time Password is no longer valid and cannot be used by the Login API. Value must be greater than 0. Defaults to 60.'
            parent_email_required: '- (Optional) Whether a parent email is required.'
            parent_registration_email_template_id: '- (Optional) The unique Id of the email template to use for parent registration.'
            password: '- (Optional) An optional password FusionAuth will use to authenticate with the SMTP server.'
            password_encryption_configuration: '- (Optional)'
            password_reset_success_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when they have completed a ''forgot password'' workflow and their password habeen reset.'
            password_reset_success_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when they have completed a ''forgot password'' workflow and their password has been reset.'
            password_update_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when they have completed a ''forgot password'' workflow and their password has been rese'
            password_update_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when their password has been updated.'
            password_validation_rules: '- (Optional)'
            passwordless_email_template_id: '- (Optional) The Id of the Passwordless Email Template.'
            passwordless_login_generator: '- (Optional)'
            passwordless_login_one_time_code_generator: '- (Optional)'
            passwordless_login_time_to_live_in_seconds: '- (Optional) The time in seconds until a passwordless code is no longer valid and cannot be used by the Passwordless API. Value must be greater than 0. Defaults to 180.'
            passwordless_template_id: '- (Optional) The Id of the Passwordless Message Template, sent to users when they start a passwordless login.'
            pending_account_link_time_to_live_in_seconds: '- (Optional) The number of seconds before the pending account link identifier is no longer valid to complete an account link request. Value must be greater than 0. Defaults to 3600'
            phone_configuration: '- (Optional)'
            phone_verification_id_generator: '- (Optional)'
            phone_verification_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a phone verification Id is no longer valid and cannot be used by the Verify Phone API. Value must be greater than 0. Defaults to 86400.'
            phone_verification_one_time_code_generator: '- (Optional)'
            port: '- (Optional) The port of the SMTP server that FusionAuth will use.'
            properties: '- (Optional) Additional Email Configuration in a properties file formatted String.'
            rate_limit_configuration: '- (Optional)'
            reauthentication_workflow: '- (Optional) The Reauthentication Workflow configuration.'
            recent_identity_change: '- (Optional) Checks if the user''s login ID has been changed recently. Defaults to true.'
            recent_password_change: '- (Optional) Checks if the user''s password has been changed recently. Defaults to true.'
            refresh_token_expiration_policy: '- (Optional) The refresh token expiration policy.'
            refresh_token_one_time_use_configuration_grace_period_in_seconds: '- (Optional) The length of time specified in seconds that a one-time use token can be reused. This value must be greater than 0 and less than 86400 which is equal to 24 hours. Setting this value to 0 effectively disables the grace period which means a one-time token may not be reused. Defaults to 0.'
            refresh_token_revocation_policy_on_login_prevented: '- (Optional) When enabled, the refresh token will be revoked when a user action, such as locking an account based on a number of failed login attempts, prevents user login.'
            refresh_token_revocation_policy_on_multi_factor_enable: '- (Optional) When enabled, all refresh tokens will be revoked when a user enables multi-factor authentication for the first time. This policy will not be applied when adding subsequent multi-factor methods to the user.'
            refresh_token_revocation_policy_on_one_time_token_reuse: '- (Optional) When enabled, if a one-time use refresh token is reused, the token will be revoked. This does not cause all refresh tokens to be revoked, only the reused token is revoked.'
            refresh_token_revocation_policy_on_password_change: '- (Optional) When enabled, the refresh token will be revoked when a user changes their password."'
            refresh_token_sliding_window_maximum_time_to_live_in_minutes: '- (Optional) The maximum lifetime of a refresh token when using a refresh token expiration policy of SlidingWindowWithMaximumLifetime. Value must be greater than 0.'
            refresh_token_time_to_live_in_minutes: '- (Optional) The length of time in minutes a Refresh Token is valid from the time it was issued. Value must be greater than 0.'
            refresh_token_usage_policy: '- (Optional) The refresh token usage policy.'
            registration_configuration: '- (Optional)'
            registration_verification_id_generator: '- (Optional)'
            registration_verification_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a registration verification Id is no longer valid and cannot be used by the Verify Registration API. Value must be greater than 0.'
            registration_verification_one_time_code_generator: '- (Optional)'
            relying_party_id: '- (Optional) The value this tenant will use for the Relying Party Id in WebAuthn ceremonies. Passkeys can only be used to authenticate on sites using the same Relying Party Id they were registered with. This value must match the browser origin or be a registrable domain suffix of the browser origin. For example, if your domain is auth.piedpiper.com, you could use auth.piedpiper.com or piedpiper.com but not m.auth.piedpiper.com or com. When this parameter is omitted, FusionAuth will use null for the Relying Party Id in passkey creation and request options. A null value in the WebAuthn JavaScript API will use the browser origin. Note: A license is required to utilize WebAuthn.'
            relying_party_name: '- (Optional) The value this tenant will use for the Relying Party name in WebAuthn ceremonies. This value may be displayed by browser or operating system dialogs during WebAuthn ceremonies. When this parameter is omitted, FusionAuth will use the tenant.issuer value. Note: A license is required to utilize WebAuthn.'
            remember_oauth_scope_consent_choice_time_to_live_in_seconds: '- (Optional) The time in seconds until remembered OAuth scope consent choices are no longer valid, and the User will be prompted to consent to requested OAuth scopes even if they have not changed. Applies only when application.oauthConfiguration.consentMode is set to RememberDecision. Value must be greater than 0. Note: An Essentials or Enterprise plan is required to utilize advanced OAuth scopes. Defaults to 2592000.'
            remember_previous_passwords: '- (Optional)'
            require_authentication: '- (Optional) Indicates whether to require an API key for the Login API when an applicationId is not provided. When an applicationId is provided to the Login API call, the application configuration will take precedence. In almost all cases, you will want to this to be true.'
            require_non_alpha: '- (Optional) Whether to force the user to use at least one non-alphanumeric character.'
            require_number: '- (Optional) Whether to force the user to use at least one number.'
            required_mixed_case: '- (Optional) Whether to force the user to use at least one uppercase and one lowercase character.'
            reset_count_in_seconds: '- (Optional) The length of time in seconds before the failed authentication count will be reset. Value must be greater than 0.'
            saml_v2_authn_request_id_ttl_seconds: '- (Optional) The time in seconds that a SAML AuthN request will be eligible for use to authenticate with FusionAuth. Defaults to 300.'
            schemas: '- (Optional) SON formatted as a SCIM Schemas endpoint response. Because the SCIM lambdas may modify the JSON response, ensure the Schema''s response matches that generated by the response lambdas. More about Schema definitions. When this parameter is not provided, it will default to EnterpriseUser, Group, and User schema definitions as defined by the SCIM core schemas spec. Note: An Enterprise plan is required to utilize SCIM.'
            scim_enterprise_user_request_converter_id: '- (Optional) The Id of a SCIM User Request lambda that will be used to convert the SCIM Enterprise User request to a FusionAuth User. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            scim_enterprise_user_response_converter_id: '- (Optional) The Id of a SCIM User Response lambda that will be used to convert a FusionAuth Enterprise User to a SCIM Server response. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            scim_group_request_converter_id: '- (Optional) The Id of a SCIM Group Request lambda that will be used to convert the SCIM Group request to a FusionAuth Group. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            scim_group_response_converter_id: '- (Optional) The Id of a SCIM Group Response lambda that will be used to convert a FusionAuth Group to a SCIM Server response. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            scim_server_configuration: '- (Optional)'
            scim_user_request_converter_id: '- (Optional) The Id of a SCIM User Request lambda that will be used to convert the SCIM User request to a FusionAuth User. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            scim_user_response_converter_id: '- (Optional) The Id of a SCIM User Response lambda that will be used to convert a FusionAuth User to a SCIM Server response. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            seconds: '- (Optional) The password minimum age in seconds. When enabled FusionAuth will not allow a password to be changed until it reaches this minimum age. Required when systemConfiguration.minimumPasswordAge.enabled is set to true.'
            secret_key: '- (Optional) The secret key for this captcha method. This field is required when tenant.captchaConfiguration.enabled is set to true.'
            security: '- (Optional) The type of security protocol FusionAuth will use when connecting to the SMTP server.'
            send_email_verification: '- (Optional)'
            send_passwordless: '- (Optional)'
            send_passwordless_phone: '- (Optional)'
            send_phone_verification: '- (Optional)'
            send_registration_verification: '- (Optional)'
            send_two_factor: '- (Optional)'
            separator: '- (Optional) A single character to use as a separator from the requested username and a unique suffix that is added when a duplicate username is detected. This value can be a single non-alphanumeric ASCII character.'
            server_entity_type_id: '- (Required) The Entity Type that will be used to represent SCIM Servers for this tenant. Note: An Enterprise plan is required to utilize SCIM. Required when scim_server_configuration.enabled is true.'
            set_password_email_template_id: '- (Optional) The Id of the Email Template that is used when a user had their account created for them and they must set their password manually and they are sent an email to set their password.'
            set_password_template_id: '- (Optional) The Id of the SMS Message Template used when a user must set their password manually after their account was created for them (by an admin, for example).'
            setup_password_id_generator: '- (Optional)'
            setup_password_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a setup password Id is no longer valid and cannot be used by the Change Password API. Value must be greater than 0.'
            site_key: '- (Optional) The site key for this captcha method. This field is required when tenant.captchaConfiguration.enabled is set to true.'
            sms: '- (Optional)'
            source_tenant_id: '- (Optional) The optional Id of an existing Tenant to make a copy of. If present, the tenant.id and tenant.name values of the request body will be applied to the new Tenant, all other values will be copied from the source Tenant to the new Tenant.'
            sso_configuration: '- (Optional)'
            strategy: '- (Optional) When enabled the user’s password will be validated during login. If the password does not meet the currently configured validation rules the user will be required to change their password.'
            suspicious_user_agent: '- (Optional) Checks whether the client''s user agent has been flagged as suspicious. Defaults to true.'
            template_id: '- (Optional) The Id of the email template that is used when notifying a user to complete a multi-factor authentication request.'
            tenant_id: '- (Optional) The Id to use for the new Tenant. If not specified a secure random UUID will be generated.'
            theme_id: '- (Optional) The unique Id of the theme to be used to style the login page and other end user templates.'
            threshold: '- (Optional) The numeric threshold which separates a passing score from a failing one. This value only applies if using either the Google v3 or HCaptcha Enterprise method, otherwise this value is ignored.'
            time_period_in_seconds: '- (Optional) The duration for the number of times a user can fail login before being rate limited.'
            time_to_live_in_seconds: '- (Optional) The length of time in seconds this JWT is valid from the time it was issued. Value must be greater than 0.'
            too_many_attempts: '- (Optional) The number of failed attempts considered to be too many. Once this threshold is reached the specified User Action will be applied to the user for the duration specified. Value must be greater than 0.'
            transaction_type: '- (Optional) The transaction type that FusionAuth uses when sending these types of events to any configured Webhooks.'
            trust_token_time_to_live_in_seconds: '- (Optional) The number of seconds before the Trust Token is no longer valid to complete a request that requires trust. Value must be greater than 0. Defaults to 180'
            two_factor_id_time_to_live_in_seconds: '- (Optional) The time in seconds until a two factor Id is no longer valid and cannot be used by the Two Factor Login API. Value must be greater than 0. Defaults to 300.'
            two_factor_method_add_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when a MFA method has been added to their account.'
            two_factor_method_add_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when a MFA method has been added to their account.'
            two_factor_method_remove_email_template_id: '- (Optional) The Id of the Email Template used to send emails to users when a MFA method has been removed from their account.'
            two_factor_method_remove_template_id: '- (Optional) The Id of the Message Template used to send a message to a user when a MFA method has been removed from their account.'
            two_factor_one_time_code_id_generator: '- (Optional)'
            two_factor_one_time_code_id_time_to_live_in_seconds: '- (Optional) The number of seconds before the Two-Factor One Time Code used to enable or disable a two-factor method is no longer valid. Must be greater than 0. Defaults to 60.'
            two_factor_trust_id_time_to_live_in_seconds: '- (Optional) The time in seconds until an issued Two Factor trust Id is no longer valid and the User will be Optional to complete Two Factor authentication during the next authentication attempt. Value must be greater than 0.'
            type: '- (Optional) The type of the secure generator used for generating the change password Id. Defaults to randomBytes.'
            ui_ip_access_control_list_id: '- (Optional) The Id of the IP Access Control List limiting access to all applications in this tenant.'
            unique: '- (Optional) Indicates that users without a verified email address will be permanently deleted after tenant.userDeletePolicy.unverified.numberOfDaysToRetain days.'
            unrecognized_device: '- (Optional) Checks whether the request originates from an unrecognized device. Defaults to true.'
            untrusted_device: '- (Optional) Checks if the request originates from a device that is not in the user''s trusted device list. Defaults to true.'
            unverified: '- (Optional)'
            unverified_enabled: '- (Optional) Indicates that users without a verified email address will be permanently deleted after tenant.userDeletePolicy.unverified.numberOfDaysToRetain days.'
            unverified_number_of_days_to_retain: '- (Optional)'
            user_action_id: '- (Optional) The Id of the User Action that is applied when the threshold is reached for too many failed authentication attempts.'
            user_delete_policy: '- (Optional)'
            user_verification_requirement: '- (Optional) Determines the user verification requirement for WebAuthn passkey registration when using the bootstrap workflow. The possible values are: Discouraged, Preferred and Required. Note: A license is required to utilize WebAuthn..'
            username: '- (Optional) An optional username FusionAuth will to authenticate with the SMTP server.'
            username_configuration: '- (Optional)'
            validate_on_login: '- (Optional) When enabled the user’s password will be validated during login. If the password does not meet the currently configured validation rules the user will be required to change their password.'
            verification_complete_template_id: '- (Optional) The Id of the Message Template used to notify a user that their phone number has been verified.'
            verification_email_template_id: '- (Optional) The Id of the Email Template that is used to send the verification emails to users. These emails are used to verify that a user’s email address ivalid. If either the verifyEmail or verifyEmailWhenChanged fields are true this field is required.'
            verification_strategy: '- (Optional) The process by which the user will verify their email address. Possible values are ClickableLink or FormField.'
            verification_template_id: '- (Optional) The Id of the Message Template used to send SMS messages to users to verify that their phone number is valid.'
            verify_email: '- (Optional) Whether the user’s email addresses are verified when the registers with your application.'
            verify_email_when_changed: '- (Optional) Whether the user’s email addresses are verified when the user changes them.'
            verify_phone_number: '- (Optional) Whether a user''s phone number is verified when they register with your application. Defaults to false.'
            webauthn_authentication_challenge_time_to_live_in_seconds: '- (Optional) The time in seconds until a WebAuthn authentication challenge is no longer valid and the User will be required to restart the WebAuthn authentication ceremony by creating a new challenge. This value also controls the timeout for the client-side WebAuthn navigator.credentials.get API call. Value must be greater than 0. Note: A license is required to utilize WebAuthn. Defaults to 180.'
            webauthn_configuration: '- (Optional) The WebAuthn configuration for this tenant.'
            webauthn_registration_challenge_time_to_live_in_seconds: '- (Optional) The time in seconds until a WebAuthn registration challenge is no longer valid and the User will be required to restart the WebAuthn registration ceremony by creating a new challenge. This value also controls the timeout for the client-side WebAuthn navigator.credentials.create API call. Value must be greater than 0. Note: A license is required to utilize WebAuthn. Defaults to 180.'
            webhook_ids: '- (Optional) An array of Webhook Ids. For Webhooks that are not already configured for All Tenants, specifying an Id on this request will indicate the associated Webhook should handle events for this tenant.'
        importStatements: []
    fusionauth_tenant_manager_configuration:
        subCategory: ""
        description: Tenant Manager Configuration Resource
        name: fusionauth_tenant_manager_configuration
        title: fusionauth_tenant_manager_configuration Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "application_configurations": [
                    {
                      "application_id": "a0c7b3b3-1e4e-4e53-99c4-1d3a5ea4ca9d"
                    }
                  ],
                  "attribute_form_id": "e95e4455-3c5e-4e53-99c4-1d3a5ea4ca9d",
                  "brand_name": "Acme Corp",
                  "identity_provider_type_configurations": [
                    {
                      "enabled": true,
                      "linking_strategy": "LinkByEmail",
                      "type": "SAMLv2"
                    }
                  ]
                }
        argumentDocs:
            application_configurations: '- (Optional) One or more application configurations for the Tenant Manager.'
            application_id: '- (Required) The unique Id of the Application that the Tenant Manager will use.'
            attribute_form_id: '- (Optional) The unique Id of the Form to use for collecting additional user attributes during Tenant Manager registration.'
            brand_name: '- (Optional) The brand name for the Tenant Manager.'
            default_attribute_mappings: '- (Optional) A map of default attribute mappings for this identity provider type.'
            enabled: '- (Optional) Whether or not this identity provider type is enabled in the Tenant Manager.'
            identity_provider_type_configurations: '- (Optional) One or more identity provider type configurations allowed in the Tenant Manager. Each block corresponds to one identity provider type.'
            linking_strategy: '- (Optional) The linking strategy for this identity provider type. Defaults to LinkByEmail. Valid values are: LinkByEmail, LinkByEmailForExistingUser, LinkByUsername, LinkByUsernameForExistingUser.'
            type: '- (Required) The identity provider type. Valid values are: OpenIDConnect, SAMLv2.'
        importStatements:
            - terraform import fusionauth_tenant_manager_configuration.example tenantmanager_cfg
    fusionauth_theme:
        subCategory: ""
        description: Theme Resource
        name: fusionauth_theme
        title: fusionauth_theme Resource - fusionauth
        examples:
            - name: mytheme
              manifest: |-
                {
                  "account_edit": "[#ftl/]",
                  "account_index": "[#ftl/]",
                  "account_two_factor_disable": "[#ftl/]",
                  "account_two_factor_enable": "[#ftl/]",
                  "account_two_factor_index": "[#ftl/]",
                  "account_webauthn_add": "[#ftl/]",
                  "account_webauthn_delete": "[#ftl/]",
                  "account_webauthn_index": "[#ftl/]",
                  "confirmation_required": "[#ftl/]",
                  "default_messages": "${file(\"${path.module}/default_messages.properties\")}",
                  "email_complete": "[#ftl/]",
                  "email_send": "[#ftl/]",
                  "email_sent": "[#ftl/]",
                  "email_verification_required": "[#ftl/]",
                  "email_verify": "[#ftl/]",
                  "helpers": "[#ftl/]",
                  "index": "[#ftl/]",
                  "name": "my theme",
                  "oauth2_authorize": "[#ftl/]",
                  "oauth2_authorized_not_registered": "[#ftl/]",
                  "oauth2_child_registration_not_allowed": "[#ftl/]",
                  "oauth2_child_registration_not_allowed_complete": "[#ftl/]",
                  "oauth2_complete_registration": "[#ftl/]",
                  "oauth2_consent": "[#ftl/]",
                  "oauth2_device": "[#ftl/]",
                  "oauth2_device_complete": "[#ftl/]",
                  "oauth2_error": "[#ftl/]",
                  "oauth2_logout": "[#ftl/]",
                  "oauth2_passwordless": "[#ftl/]",
                  "oauth2_register": "[#ftl/]",
                  "oauth2_start_idp_link": "[#ftl/]",
                  "oauth2_two_factor": "[#ftl/]",
                  "oauth2_two_factor_enable": "[#ftl/]",
                  "oauth2_two_factor_enable_complete": "[#ftl/]",
                  "oauth2_two_factor_methods": "[#ftl/]",
                  "oauth2_wait": "[#ftl/]",
                  "oauth2_webauthn": "[#ftl/]",
                  "oauth2_webauthn_reauth": "[#ftl/]",
                  "oauth2_webauthn_reauth_enable": "[#ftl/]",
                  "password_change": "[#ftl/]",
                  "password_complete": "[#ftl/]",
                  "password_forgot": "[#ftl/]",
                  "password_sent": "[#ftl/]",
                  "phone_complete": "[#ftl/]",
                  "phone_sent": "[#ftl/]",
                  "phone_verification_required": "[#ftl/]",
                  "phone_verify": "[#ftl/]",
                  "registration_complete": "[#ftl/]",
                  "registration_send": "[#ftl/]",
                  "registration_sent": "[#ftl/]",
                  "registration_verification_required": "[#ftl/]",
                  "registration_verify": "[#ftl/]",
                  "samlv2_logout": "[#ftl/]",
                  "stylesheet": "/* stylish */",
                  "unauthorized": "[#ftl/]"
                }
        argumentDocs:
            account_edit: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/edit path. This page contains a form that enables authenticated users to update their profile.'
            account_index: '- (Optional) A FreeMarker template that is rendered when the user requests the /account path. This is the self-service account landing page. An authenticated user may use this as a starting point for operations such as updating their profile or configuring multi-factor authentication.'
            account_two_factor_disable: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/two-factor/disable path. This page contains a form that accepts a verification code used to disable a multi-factor authentication method.'
            account_two_factor_edit: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/two-factor/edit path. This page contains a form that allows the user to edit the name of a multi-factor authentication method.'
            account_two_factor_enable: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/two-factor/enable path. This page contains a form that accepts a verification code used to enable a multi-factor authentication method. Additionally, this page contains presentation of recovery codes when a user enables multi-factor authentication for the first time.'
            account_two_factor_index: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/two-factor path. This page displays an authenticated user’s configured multi-factor authentication methods. Additionally, it provides links to enable and disable a method.'
            account_webauthn_add: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/webauthn/add path. This page contains a form that allows a user to register a new WebAuthn passkey.'
            account_webauthn_delete: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/webauthn/delete path. This page contains a form that allows a user to delete a WebAuthn passkey.'
            account_webauthn_index: '- (Optional) A FreeMarker template that is rendered when the user requests the /account/webauthn/ path. This page displays an authenticated user’s registered WebAuthn passkeys. Additionally, it provides links to delete an existing passkey and register a new passkey.'
            confirmation_required: '- (Optional) A FreeMarker template that is rendered when the user requests the /confirmation-required path. This page is displayed when a user attempts to complete an email based workflow that did not begin in the same browser. For example, if the user starts a forgot password workflow, and then opens the link in a separate browser the user will be shown this panel.'
            data: '- (Optional) A JSON string that can hold any information about the Theme that should be persisted.'
            default_messages: '- (Optional) A properties file formatted String containing at least all of the message keys defined in the FusionAuth shipped messages file.'
            email_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /email/complete path. This page is used after a user has verified their email address by clicking the URL in the email. After FusionAuth has updated their user object to indicate that their email was verified, the browser is redirected to this page.'
            email_send: '- (Optional) A FreeMarker template that is rendered when the user requests the /email/send page. This page is used after a user has asked for the verification email to be resent. This can happen if the URL in the email expired and the user clicked it. In this case, the user can provide their email address again and FusionAuth will resend the email. After the user submits their email and FusionAuth re-sends a verification email to them, the browser is redirected to this page.'
            email_sent: '- (Optional) A FreeMarker template that is rendered when the user requests the /email/sent path. This page is used after a user has asked for the verification email to be resent. This can happen if the URL in the email expired and the user clicked it. In this case, the user can provide their email address again and FusionAuth will resend the email. After the user submits their email and FusionAuth re-sends a verification email to them, the browser is redirected to this page.'
            email_verification_required: '- (Optional) A FreeMarker template that is rendered when the user requests the /email/verification-required path. This page is rendered when a user is required to verify their email address prior to being allowed to proceed with login. This occurs when Unverified behavior is set to Gated in email verification settings on the Tenant.'
            email_verify: '- (Optional) A FreeMarker template that is rendered when the user requests the /email/verify path. This page is rendered when a user clicks the URL from the verification email and the verificationId has expired. FusionAuth expires verificationId after a period of time (which is configurable). If the user has a URL from the verification email that has expired, this page will be rendered and the error will be displayed to the user.'
            helpers: '- (Optional) A FreeMarker template that contains all of the macros and templates used by the rest of the login Theme FreeMarker templates. This allows you to configure the general layout of your UI configuration and login theme without having to copy and paste HTML into each of the templates.'
            index: '- (Optional) A FreeMarker template that is rendered when the user requests the / path. This is the root landing page. This page is available to unauthenticated users and will be displayed whenever someone navigates to the FusionAuth host’s root page. Prior to version 1.27.0, navigating to this URL would redirect to /admin and would subsequently render the FusionAuth admin login page.'
            localized_messages: '- (Optional) A Map of localized versions of the messages. The key is the Locale and the value is a properties file formatted String.'
            name: '- (Required) A unique name for the Theme.'
            oauth2_authorize: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/authorize path. This is the main login page for FusionAuth and is used for all interactive OAuth2 and OpenID Connect workflows.'
            oauth2_authorized_not_registered: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/authorized-not-registered path. This page is rendered when a user is not registered and the Application configuration requires registration before FusionAuth will complete the redirect.'
            oauth2_child_registration_not_allowed: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/child-registration-not-allowed path. This page contains a form where a child must provide their parent’s email address to ask their parent to create an account for them in a Consent workflow.'
            oauth2_child_registration_not_allowed_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/child-registration-not-allowed-complete path. This page is rendered is rendered after a child provides their parent’s email address for parental consent in a Consent workflow.'
            oauth2_complete_registration: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/complete-registration path. This page contains a form that is used for users that have accounts but might be missing required fields.'
            oauth2_consent: '- (Optional) A FreeMarker template that is rendered when a third party application requests scopes from the user.'
            oauth2_device: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/device path. This page contains a form for accepting an end user’s short code for the interactive portion of the OAuth Device Authorization Grant workflow.'
            oauth2_device_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/device-complete path. This page contains a complete message indicating the device authentication has completed.'
            oauth2_error: '- (Optional) This page is used if the user starts or is in the middle of the OAuth workflow and any type of error occurs. This could be caused by the user messing with the URL or internally some type of information wasn’t passed between the OAuth endpoints correctly. For example, if you are federating login to an external IdP and that IdP does not properly echo the state parameter, FusionAuth’s OAuth workflow will break and this page will be displayed.'
            oauth2_logout: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/logout page. This page is used if the user initiates a logout. This page causes the user to be logged out of all associated applications via a front-channel mechanism before being redirected.'
            oauth2_passwordless: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/passwordless path. This page is rendered when the user starts the passwordless login workflow. The page renders the form where the user types in their email address.'
            oauth2_register: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/register path. This page is used to register or sign up the user for the application when self-service registration is enabled.'
            oauth2_start_idp_link: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/start-idp-link path. This page is used if the Identity Provider is configured to have a pending link. The user is presented with the option to link their account with an existing FusionAuth user account.'
            oauth2_two_factor: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/two-factor path. This page is used if the user has two-factor authentication enabled and they need to type in their code again. FusionAuth will properly handle the processing on the back end. This page contains the form that the user will put their code into.'
            oauth2_two_factor_enable: '- (Optional) A FreeMarker template that contains the OAuth2 two-factor enable form.'
            oauth2_two_factor_enable_complete: '- (Optional) A FreeMarker template that contains the OAuth2 two-factor enable complete form.'
            oauth2_two_factor_methods: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/two-factor-methods path. This page contains a form providing a user with their configured multi-factor authentication options that they may use to complete the authentication challenge.'
            oauth2_wait: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/wait path. This page is rendered when FusionAuth is waiting for an external provider to complete an out of band authentication request. For example, during a HYPR login this page will be displayed until the user completes authentication.'
            oauth2_webauthn: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/webauthn path. This page contains a form where a user can enter their loginId (username or email address) to authenticate with one of their registered WebAuthn passkeys. This page uses the WebAuthn bootstrap workflow.'
            oauth2_webauthn_reauth: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/webauthn-reauth path. This page contains a form that lists the WebAuthn passkeys currently available for re-authentication. A user can select one of the listed passkeys to authenticate using the corresponding passkey and user account.'
            oauth2_webauthn_reauth_enable: '- (Optional) A FreeMarker template that is rendered when the user requests the /oauth2/webauthn-reauth-enable path. This page contains two forms. One allows the user to select one of their existing WebAuthn passkeys to use for re-authentication. The other allows the user to register a new WebAuthn passkey for re-authentication.'
            password_change: '- (Optional) A FreeMarker template that is rendered when the user requests the /password/change path. This page is used if the user is required to change their password or if they have requested a password reset. This page contains the form that allows the user to provide a new password.'
            password_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /password/complete path. This page is used after the user has successfully updated their password, or reset it. This page should instruct the user that their password was updated and that they need to login again.'
            password_forgot: '- (Optional) A FreeMarker template that is rendered when the user requests the /password/forgot path. This page is used when a user starts the forgot password workflow. This page renders the form where the user types in their email address.'
            password_sent: '- (Optional) A FreeMarker template that is rendered when the user requests the /password/sent path. This page is used when a user has submitted the forgot password form with their email. FusionAuth does not indicate back to the user if their email address was valid in order to prevent malicious activity that could reveal valid email addresses. Therefore, this page should indicate to the user that if their email was valid, they will receive an email shortly with a link to reset their password.'
            phone_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /phone/complete path. This page is used after a user has verified their phone number by clicking the URL in the message. After FusionAuth has updated their user object to indicate that their phone number was verified, the browser is redirected to this page.'
            phone_sent: '- (Optional) A FreeMarker template that is rendered when the user requests the /phone/sent path. This page is used after a user has asked for the verification message to be resent. This can happen if the URL in the message expired and the user clicked it. In this case, the user can provide their phone number again and FusionAuth will resend the message. After the user submits their phone number and FusionAuth re-sends a verification message to them, the browser is redirected to this page.'
            phone_verification_required: '- (Optional) A FreeMarker template that is rendered when the user requests the /phone/verification-required path. This page is rendered when a user is required to verify their phone number prior to being allowed to proceed with login. This occurs when Unverified behavior is set to Gated in identities/phone verification settings on the Tenant.'
            phone_verify: '- (Optional) A FreeMarker template that is rendered when the user requests the /phone/verify path. This page is rendered when a user clicks the URL from the verification message and the verificationId has expired. FusionAuth expires verificationId after a period of time (which is configurable). If the user has a URL from the verification message that has expired, this page will be rendered and the error will be displayed to the user.'
            registration_complete: '- (Optional) A FreeMarker template that is rendered when the user requests the /registration/complete path. This page is used after a user has verified their email address for a specific application (i.e. a user registration) by clicking the URL in the email. After FusionAuth has updated their registration object to indicate that their email was verified, the browser is redirected to this page.'
            registration_send: '- (Optional) A FreeMarker template that is rendered when the user requests the /registration/send page. This page is used after a user has asked for the application specific verification email to be resent. This can happen if the URL in the email expired and the user clicked it. In this case, the user can provide their email address again and FusionAuth will resend the email. After the user submits their email and FusionAuth re-sends a verification email to them, the browser is redirected to this page.'
            registration_sent: '- (Optional) A FreeMarker template that is rendered when the user requests the /registration/sent path. This page is used after a user has asked for the application specific verification email to be resent. This can happen if the URL in the email expired and the user clicked it. In this case, the user can provide their email address again and FusionAuth will resend the email. After the user submits their email and FusionAuth re-sends a verification email to them, the browser is redirected to this page.'
            registration_verification_required: '- (Optional) A FreeMarker template that is rendered when the user requests the /registration/verification-required path. This page is rendered when a user is required to verify their registration prior to being allowed to proceed with the registration flow. This occurs when Unverified behavior is set to Gated in registration verification settings on the Application.'
            registration_verify: '- (Optional) A FreeMarker template that is rendered when the user requests the /registration/verify path. This page is used when a user clicks the URL from the application specific verification email and the verificationId has expired. FusionAuth expires verificationId after a period of time (which is configurable). If the user has a URL from the verification email that has expired, this page will be rendered and the error will be displayed to the user.'
            samlv2_logout: '- (Optional) A FreeMarker template that is rendered when the user requests the /samlv2/logout path. This page is used if the user initiates a SAML logout. This page causes the user to be logged out of all associated applications via a front-channel mechanism before being redirected.'
            source_theme_id: '- (Optional) The Id of an existing Theme to copy when creating this Theme. The default_messages, localized_messages, templates, and stylesheet are copied from the source Theme, and any of those fields you set are applied on top on the first apply. Only used at create time.'
            stylesheet: '- (Optional) A CSS stylesheet used to style the templates.'
            theme_id: '- (Optional) The Id to use for the new Theme. If not specified a secure random UUID will be generated.'
            unauthorized: '- (Optional) An optional FreeMarker template that contains the unauthorized page.'
        importStatements: []
    fusionauth_twilio_messenger:
        subCategory: ""
        description: Twilio Messenger Resource
        name: fusionauth_twilio_messenger
        title: fusionauth_twilio_messenger Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "account_sid": "983C6FACEBBE4D858570FADD967A9DD7",
                  "auth_token": "184C73BE8E44420EBAA0BA147A61B6A9",
                  "data": "${jsonencode({\n    foo = \"bar\"\n  })}",
                  "debug": false,
                  "from_phone_number": "555-555-6666",
                  "name": "Twilio Messenger",
                  "url": "https://api.twilio.com"
                }
        argumentDocs:
            account_sid: '- (Required) The Twilio Account ID to use when connecting to the Twilio API. This can be found in your Twilio dashboard.'
            auth_token: '- (Optional) The Twilio Auth Token to use when connecting to the Twilio API. This can be found in your Twilio dashboard.'
            data: '- (Optional) A JSON string that can hold any information about the Twilio Messenger that should be persisted. Must be a JSON string.'
            debug: '- (Optional) If debug is enabled, an event log is created to assist in debugging messenger errors. Defaults to false.'
            from_phone_number: '- (Optional) The configured Twilio phone number that will be used to send messages. This can be found in your Twilio dashboard.'
            messaging_service_sid: '- (Optional) The Twilio message service Id, this is used when using Twilio Copilot to load balance between numbers. This can be found in your Twilio dashboard. If this is set, the fromPhoneNumber will be ignored.'
            messenger_id: '- (Optional) The Id to use for the new Messenger. If not specified a secure random UUID will be generated.'
            name: '- (Required) The unique Messenger name.'
            url: '- (Required) The Twilio URL that FusionAuth will use to communicate with the Twilio API.'
        importStatements: []
    fusionauth_user:
        subCategory: ""
        description: User Resource
        name: fusionauth_user
        title: fusionauth_user Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "birth_date": "1976-05-30",
                  "data": "${jsonencode({\n    displayName = \"Johnny Boy\"\n    favoriteColors = [\n      \"Red\",\n      \"Blue\"\n    ]\n  })}",
                  "email": "example@fusionauth.io",
                  "encryption_scheme": "salted-sha256",
                  "expiry": 1571786483322,
                  "first_name": "John",
                  "full_name": "John Doe",
                  "image_url": "http://65.media.tumblr.com/tumblr_l7dbl0MHbU1qz50x3o1_500.png",
                  "last_name": "Doe",
                  "middle_name": "William",
                  "mobile_phone": "303-555-1234",
                  "password_change_required": false,
                  "preferred_languages": [
                    "en",
                    "fr"
                  ],
                  "timezone": "America/Denver",
                  "user_id": "4c4511df-0d0d-4029-8c2b-f6c01b9e138d",
                  "username": "johnny123",
                  "username_status": "ACTIVE"
                }
        argumentDocs:
            application_id: (Optional) An optional Application Id. When this value is provided, it will be used to resolve an application specific email template if you have configured transactional emails such as setup password, email verification and others.
            authenticator_algorithm: '- (Optional) The algorithm used by the TOTP authenticator. With the current implementation, this will always be HmacSHA1.'
            authenticator_code_length: '- (Optional) The length of code generated by the TOTP. With the current implementation, this will always be 6.'
            authenticator_time_step: '- (Optional) The time-step size in seconds. With the current implementation, this will always be 30.'
            birth_date: '- (Optional) An ISO-8601 formatted date of the User’s birthdate such as YYYY-MM-DD.'
            data: '- (Optional) A JSON string that can hold any information about a User that should be persisted. Must be a JSON serialised string.'
            disable_domain_block: '- (Optional) A tenant has the option to configure one or more email domains to be blocked in order to restrict email domains during user create or update. Setting this property equal to true will override the tenant configuration. See registration_configuration.blocked_domains in the Tenant resource.'
            display_value: '- The display value for the identity. Only used for username type identities. If the unique username feature is not enabled, this value will be the same as user.identities[x].value. Otherwise, it will be the username the User has chosen. For primary username identities, this will be the same value as user.username.'
            email: '- (Optional) The User’s email address. An email address is a unique in FusionAuth and stored in lower case.'
            encryption_scheme: '- (Optional) The method for encrypting the User’s password.'
            expiry: '- (Optional) The expiration instant of the User’s account. An expired user is not permitted to login.'
            first_name: '- (Optional) The first name of the User.'
            full_name: '- (Optional) The User’s full name as a separate field that is not calculated from firstName and lastName.'
            identities: '- The list of identities that exist for a User.'
            image_url: '- (Optional) The URL that points to an image file that is the User’s profile image.'
            insert_instant: '- The instant when the identity was created.'
            last_login_instant: '- The instant when the identity was last used to log in. If a User has multiple identity types (username, email, and phoneNumber), then this value will represent the specific identity they last used to log in. This contrasts with user.lastLoginInstant, which represents the last time any of the User’s identities was used to log in.'
            last_name: '- (Optional) The User’s last name.'
            last_update_instant: '- The instant when the identity was last updated.'
            method: '- (Optional) The type of this method. There will also be an object with the same value containing additional information about this method.'
            middle_name: '- (Optional) The User’s middle name.'
            mobile_phone: '- (Optional) The User’s mobile phone number. This is useful is you will be sending push notifications or SMS messages to the User.'
            moderation_status: '- The current status of the username. This is used if you are moderating usernames via CleanSpeak.'
            name: '- (Optional) A user-friendly name for this two-factor method, for example "Work authenticator".'
            one_time_code: '- A one time code that will be paired with the verificationIds[x].id.'
            parent_email: '- (Optional) The email address of the user’s parent or guardian. This field is used to allow a child user to identify their parent so FusionAuth can make a request to the parent to confirm the parent relationship.'
            password: '- (Optional) The User’s plaintext password. This password will be hashed and the provided value will never be stored and cannot be retrieved.'
            password_change_required: '- (Optional) Indicates that the User’s password needs to be changed during their next login attempt.'
            phone_number: '- (Optional) The phone number of the User. The phone number is stored and returned in E.164 canonical format, however a phone number is considered unique regardless of the format. 303-555-1212 is considered equal to +13035551212 so either version of this phone number can be used whenever providing it as input to an API. If phone_number is not provided, then email or username will be required.'
            preferred_languages: '- (Optional) An array of locale strings that give, in order, the User’s preferred languages. These are important for email templates and other localizable text.'
            secret: '- (Optional) A base64 encoded secret'
            send_set_password_email: '- (Optional, Deprecated) Indicates to FusionAuth to send the User an email asking them to set their password. The Email Template that is used is configured in the System Configuration setting for Set Password Email Template. Use send_set_password_identity_type instead.'
            send_set_password_identity_type: '- (Optional) If set, FusionAuth will send the User a message asking them to set their password. When you set this value to anything but doNotSend, any provided password field is ignored. The possible values are doNotSend, email, and phone.'
            skip_verification: '- (Optional) Indicates to FusionAuth that it should skip email verification even if it is enabled. This is useful for creating admin or internal User accounts.'
            tenant_id: '- (Optional) The unique Id of the tenant used to scope this API request.'
            timezone: '- (Optional) The User’s preferred timezone. The string must be in an IANA time zone format.'
            two_factor_methods: ""
            type: '- The identity type that the verification Id is for. This identity type, along with verificationIds[x].value , matches exactly one identity via user.identities[x].type.'
            user_id: '- (Optional) The Id to use for the new User. If not specified a secure random UUID will be generated..'
            username: '- (Optional) The username of the User. The username is stored and returned as a case sensitive value, however a username is considered unique regardless of the case. bob is considered equal to BoB so either version of this username can be used whenever providing it as input to an API.'
            username_status: '- (Optional) The current status of the username. This is used if you are moderating usernames via CleanSpeak.'
            value: '- The identity value that the verification Id is for. This identity value, along with verificationIds[x].type , matches exactly one identity via user.identities[x].value.'
            verification_id: '- A verification Id.'
            verification_ids: '- The list of all verifications that exist for a user. This includes the email and phone identities that a user may have. The values from emailVerificationId and emailVerificationOneTimeCode are legacy fields and will also be present in this list.'
            verified: '- Whether verification was actually performed on the identity by FusionAuth.'
            verified_instant: '- The instant when verification was performed on the identity.'
            verified_reason: '- The reason the User’s identity was verified or not verified.'
        importStatements: []
    fusionauth_user_action:
        subCategory: ""
        description: User Action Resource
        name: fusionauth_user_action
        title: fusionauth_user_action Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "name": "Lock user",
                  "prevent_login": true,
                  "temporal": true
                }
        argumentDocs:
            cancel_email_template_id: '- (Optional) The Id of the Email Template that is used when User Actions are canceled.'
            end_email_template_id: '- (Optional) The Id of the Email Template that is used when User Actions expired automatically (end).'
            include_email_in_event_json: '- (Optional) Whether to include the email information in the JSON that is sent to the Webhook when a user action is taken.'
            localized_names: '- (Optional) A mapping of localized names for this User Action. The key is the Locale and the value is the name of the User Action for that language.'
            modify_email_template_id: '- (Optional) The Id of the Email Template that is used when User Actions are modified.'
            name: '- (Required) The name of this User Action.'
            options: '- (Optional)'
            prevent_login: '- (Optional) Whether or not this User Action will prevent user login. When this value is set to true the action must also be marked as a time based action. See temporal.'
            send_end_event: '- (Optional) Whether or not FusionAuth will send events to any registered Webhooks when this User Action expires.'
            start_email_template_id: '- (Optional) The Id of the Email Template that is used when User Actions are started (created).'
            temporal: '- (Optional) Whether or not this User Action is time-based (temporal).'
            transaction_type: '- (Optional) Specifies how FusionAuth will manage notifying Webhooks before this action is committed. The options are: None, Any, SimpleMajority, SuperMajority or AbsoluteMajority. The default is None.'
            user_action_id: '- (Optional) The id of this User Action.'
            user_emailing_enabled: '- (Optional) Whether or not email is enabled for this User Action.'
            user_notifications_enabled: '- (Optional) Whether or not user notifications are enabled for this User Action.'
        importStatements: []
    fusionauth_user_group_membership:
        subCategory: ""
        description: User Group Membership Resource
        name: fusionauth_user_group_membership
        title: fusionauth_user_group_membership Resource - fusionauth
        examples:
            - name: this
              manifest: |-
                {
                  "group_id": "${fusionauth_group.this.id}",
                  "user_id": "${fusionauth_user.this.id}"
                }
              references:
                group_id: fusionauth_group.this.id
                user_id: fusionauth_user.this.id
        argumentDocs:
            data: '- (Optional) A JSON string that can hold any information about the User for this membership that should be persisted.'
            group_id: '- (Required) The Id of the Group of this membership.'
            membership_id: '- (Optional) The Id of the User Group Membership. If not provided, a random UUID will be generated.'
            user_id: '- (Required) "The Id of the User of this membership.'
        importStatements: []
