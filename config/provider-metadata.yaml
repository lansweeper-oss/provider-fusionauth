    fusionauth_consent:
        subCategory: ""
        description: Consent Resource
        name: fusionauth_consent
        title: fusionauth_consent Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "consent_email_template_id": "04881b0a-f543-4218-ae1d-ee009591a4b4",
                  "country_minimum_age_for_self_consent": {
                    "de": 17,
                    "uk": 16,
                    "us": 13
                  },
                  "data": "${jsonencode({\n    description = \"Marketing consent for newsletter\"\n    internal_id = \"MKT-001\"\n  })}",
                  "default_minimum_age_for_self_consent": 16,
                  "email_plus": [
                    {
                      "email_template_id": "847de2b9-14ba-45fc-9726-9d9c9fcee4b6",
                      "enabled": true,
                      "maximum_time_to_send_email_in_hours": 48,
                      "minimum_time_to_send_email_in_hours": 24
                    }
                  ],
                  "multiple_values_allowed": true,
                  "name": "Newsletter Signup",
                  "values": [
                    "Email",
                    "SMS",
                    "Phone"
                  ]
                }
        argumentDocs:
            consent_email_template_id: '- (Optional) The Id of the Email Template that is used to send confirmation to the end user. If omitted, an email will not be sent to the user.'
            consent_id: '- (Optional) The Id to use for the new Consent. If not specified a secure random UUID will be generated.'
            country_minimum_age_for_self_consent: '- (Optional) This property optionally overrides the value provided in default_minimum_age_for_self_consent if a more specific value is defined. This can be useful when the age of self consent varies by country.'
            data: '- (Optional) An object that can hold any information about the Consent that should be persisted. Must be a JSON string.'
            default_minimum_age_for_self_consent: '- (Required) The default age of self consent used when granting this consent to a user unless a more specific one is provided by the country_minimum_age_for_self_consent.'
            email_plus: '- (Optional) Email Plus provides an additional opportunity to notify the giver that consent was provided. Configuration block detailed below.'
            email_template_id: '- (Required) The Id of the Email Template that is used to send the reminder notice to the consent giver.'
            enabled: '- (Optional) Set to true to enable the Email Plus workflow. Default is false.'
            maximum_time_to_send_email_in_hours: '- (Optional) The maximum number of hours to wait until sending the reminder notice to the consent giver. Default is 48.'
            minimum_time_to_send_email_in_hours: '- (Optional) The minimum number of hours to wait until sending the reminder notice to the consent giver. Default is 24.'
            multiple_values_allowed: '- (Optional) Set to true if more than one value may be used when granting this consent to a User. Default is false.'
            name: '- (Required) The unique name of the consent.'
            values: '- (Optional) The list of values that may be assigned to this consent. Required when multiple_values_allowed is set to true.'
        importStatements:
            - terraform import fusionauth_consent.example 34ee46ad-60a7-44f6-8edf-d818c2209072
    fusionauth_email:
        subCategory: ""
        description: Email Resource
        name: fusionauth_email
        title: fusionauth_email Resource - fusionauth
        examples:
            - name: HelloWorld
              manifest: |-
                {
                  "default_from_name": "Welcome Team",
                  "default_html_template": "${file(\"${path.module}/email_templates/HelloWorld.html.ftl\")}",
                  "default_subject": "Hello",
                  "default_text_template": "${file(\"${path.module}/email_templates/HelloWorld.txt.ftl\")}",
                  "from_email": "welcome@example.com.com",
                  "name": "Hello World"
                }
        argumentDocs:
            default_from_name: '- (Optional) The default From Name used when sending emails. If not provided, and a localized value cannot be determined, the default value for the tenant will be used. This is the display name part of the email address ( i.e. Jared Dunn jared@piedpiper.com).'
            default_html_template: '- (Required) The default HTML Email Template.'
            default_subject: '- (Required) The default Subject used when sending emails.'
            default_text_template: '- (Required) The default Text Email Template.'
            email_id: '- (Optional) The Id to use for the new Email Template. If not specified a secure random UUID will be generated.'
            from_email: '- (Optional) The email address that this email will be sent from. If not provided, the default value for the tenant will be used. This is the address part email address (i.e. Jared Dunn jared@piedpiper.com).'
            localized_from_names: '- (Optional) The From Name used when sending emails to users who speak other languages. This overrides the default From Name based on the user’s list of preferred languages.'
            localized_html_templates: '- (Optional) The HTML Email Template used when sending emails to users who speak other languages. This overrides the default HTML Email Template based on the user’s list of preferred languages.'
            localized_subjects: '- (Optional) The Subject used when sending emails to users who speak other languages. This overrides the default Subject based on the user’s list of preferred languages.'
            localized_text_templates: '- (Optional) The Text Email Template used when sending emails to users who speak other languages. This overrides the default Text Email Template based on the user’s list of preferred languages.'
            name: '- (Required) A descriptive name for the email template (i.e. "April 2016 Coupon Email")'
        importStatements: []
    fusionauth_entity:
        subCategory: ""
        description: Entity Resource
        name: fusionauth_entity
        title: fusionauth_entity Resource - fusionauth
        examples:
            - name: raviga
              manifest: |-
                {
                  "client_id": "092dbded-30af-4149-9c61-b578f2c72f59",
                  "client_secret": "+fcXet9Iu2kQi61yWD9Tu4ReZ113P6yEAkr32v6WKOQ=",
                  "data": "${jsonencode({\n    companyType = \"Legal\"\n  })}",
                  "entity_type_id": "${fusionauth_entity_type.company.id}",
                  "name": "Raviga",
                  "tenant_id": "${fusionauth_tenant.default.id}"
                }
              references:
                entity_type_id: fusionauth_entity_type.company.id
                tenant_id: fusionauth_tenant.default.id
              dependencies:
                fusionauth_entity_permission.file_lawsuit: |-
                    {
                      "data": "${jsonencode({\n    foo = \"bar\"\n  })}",
                      "description": "Enables the ability to file lawsuits",
                      "entity_type_id": "${fusionauth_entity_type.company.id}",
                      "is_default": true,
                      "name": "file-lawsuit"
                    }
                fusionauth_entity_type.company: |-
                    {
                      "data": "${jsonencode({\n    createdBy = \"jared@fusionauth.io\"\n  })}",
                      "jwt_configuration": [
                        {
                          "access_token_key_id": "a7516c7c-6234-4021-b0b4-8870c807aeb2",
                          "enabled": true,
                          "time_to_live_in_seconds": 3600
                        }
                      ],
                      "name": "Company"
                    }
        argumentDocs:
            Device: ', API or Company.'
            client_id: |-
                - (Optional) The OAuth 2.0 client ID. If you leave this blank on create, the value of the Entity ID will
                be used. Must be a UUID.
            client_secret: |-
                - (Optional) The OAuth 2.0 client secret. If you leave this blank on create, a secure secret will be
                generated for you. If you leave this blank during an update, the previous value will be maintained. For both create
                and update you can provide a value and it will be stored.
            data: |-
                - (Optional) A JSON string that can hold any information about the Entity that should be persisted. Please review
                the limits on data field types as you plan for and build your custom data schema. Must be a JSON serialised string.
            entity_id: '- (Optional) The ID to use for the new Entity. If not specified a secure random UUID will be generated.'
            entity_type_id: '- (Required) The ID of the Entity Type. Types are consulted for permission checks.'
            name: '- (Required) A descriptive name for the Entity (i.e. "Raviga" or "Email Service").'
            nest device: ', an Email API or Raviga.'
            read: ', write, or file-lawsuit.'
            tenant_id: '- (Optional) The unique ID of the tenant used to scope this API request.'
        importStatements:
            - terraform import fusionauth_entity.name tenant_id:entity_id
    fusionauth_entity_grant:
        subCategory: ""
        description: Entity Grant Resource
        name: fusionauth_entity_grant
        title: fusionauth_entity_grant Resource - fusionauth
        examples:
            - name: david
              manifest: |-
                {
                  "data": "${jsonencode({\n    expiresAt = 1695361142909\n  })}",
                  "entity_id": "${fusionauth_entity.raviga.id}",
                  "permissions": [
                    "${fusionauth_entity_type_permission.read.name}",
                    "${fusionauth_entity_type_permission.write.name}",
                    "${fusionauth_entity_type_permission.sue.name}",
                    "${fusionauth_entity_type_permission.file_lawsuit.name}"
                  ],
                  "tenant_id": "${fusionauth_tenant.default.id}",
                  "user_id": "${fusionauth_user.david.id}"
                }
              references:
                entity_id: fusionauth_entity.raviga.id
                permissions: fusionauth_entity_type_permission.read.name
                tenant_id: fusionauth_tenant.default.id
                user_id: fusionauth_user.david.id
            - name: raviga
              manifest: |-
                {
                  "data": "${jsonencode({\n    foo = \"bar\"\n  })}",
                  "entity_id": "${fusionauth_entity.raviga.id}",
                  "permissions": [
                    "${fusionauth_entity_type_permission.read.name}",
                    "${fusionauth_entity_type_permission.write.name}",
                    "${fusionauth_entity_type_permission.sue.name}",
                    "${fusionauth_entity_type_permission.file_lawsuit.name}"
                  ],
                  "recipient_entity_id": "${fusionauth_entity.raviga.id}",
                  "tenant_id": "${fusionauth_tenant.default.id}"
                }
              references:
                entity_id: fusionauth_entity.raviga.id
                permissions: fusionauth_entity_type_permission.read.name
                recipient_entity_id: fusionauth_entity.raviga.id
                tenant_id: fusionauth_tenant.default.id
        argumentDocs:
            data: '- (Optional) A JSON string that can hold any information about the Grant that should be persisted. Please review the limits on data field types as you plan for and build your custom data schema.  Must be a JSON string.'
            entity_id: '- (Required) The Id of the Entity to which access is granted.'
            permissions: '- (Optional) The set of permissions of this Grant.'
            recipient_entity_id: '- (Optional) The Entity Id for which access is granted. If recipient_entity_id is not provided, then the user_id will be required.'
            tenant_id: '- (Optional) The unique Id of the tenant used to scope this API request.'
            user_id: '- (Optional) The User Id for which access is granted. If user_id is not provided, then the recipient_entity_id will be required.'
        importStatements: []
    fusionauth_entity_type:
        subCategory: ""
        description: Entity Type Resource
        name: fusionauth_entity_type
        title: fusionauth_entity_type Resource - fusionauth
        examples:
            - name: company
              manifest: |-
                {
                  "data": "${jsonencode({\n    createdBy = \"jared@fusionauth.io\"\n  })}",
                  "jwt_configuration": [
                    {
                      "access_token_key_id": "a7516c7c-6234-4021-b0b4-8870c807aeb2",
                      "enabled": true,
                      "time_to_live_in_seconds": 3600
                    }
                  ],
                  "name": "Company"
                }
        argumentDocs:
            access_token_key_id: |-
                - (Required) The unique ID of the signing key used to sign the access token. Required when
                enabled is set to true.
            access_token_verification_key_ids: |-
                - (Optional) The list of access token verification key Ids that are trusted for
                this entity type when entity JWTs are presented to /oauth2/introspect or in SCIM use cases.
                access_token_key_id is implicitly included in this list and does not need to be explicitly specified. If
                access_token_key_id is changed to a new key and the old key is supplied in this field, then this facilitates key
                rotation because FusionAuth will trust JWTs signed by both keys, while only signing JWTs with the new key.
                Requires FusionAuth 1.69.0 or later.
            data: '- (Optional) A JSON string that can hold any information about the Entity Type that should be persisted. Must be aJSON string.'
            enabled: |-
                - (Optional) Indicates if this application is using the JWT configuration defined here or the global JWT
                configuration defined by the Tenant. If this is false the signing algorithm configured in the Tenant will be used.
                If true the signing algorithm defined in this application will be used.
            entity_type_id: '- (Optional) The ID to use for the new Entity Type. If not specified a secure random UUID will be generated.'
            jwt_configuration: '- (Optional) A block to configure JSON Web Token (JWT) options.'
            name: '- (Required) A descriptive name for the entity type (i.e. Customer or Email_Service).'
            time_to_live_in_seconds: '- (Required) The length of time in seconds the JWT will live before it is expired and no longer valid. Required when enabled is set to true.'
        importStatements: []
    fusionauth_entity_type_permision Resource - fusionauth:
