    fusionauth_registration:
        subCategory: ""
        description: Registration Resource
        name: fusionauth_registration
        title: fusionauth_registration Resource - fusionauth
        examples:
            - name: example
              manifest: |-
                {
                  "application_id": "${data.fusionauth_application.FusionAuth.id}",
                  "roles": [
                    "admin"
