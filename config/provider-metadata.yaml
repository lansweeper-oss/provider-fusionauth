                  "header_key_parameter": "kid",
                  "name": "Acme Corp. ADFS",
                  "oauth2_authorization_endpoint": "https://acme.com/adfs/oauth2/authorize?client_id=cf3b00da-9551-460a-ad18-33232e6cbff0\u0026response_type=code\u0026redirect_uri=https://acme.com/oauth2/redirect",
                  "oauth2_token_endpoint": "https://acme.com/adfs/oauth2/token",
                  "unique_identity_claim": "email"
                }
        argumentDocs:
            application_configuration: '- (Optional) The configuration for each Application that the identity provider is enabled for.'
            application_id: '- (Optional) ID of the Application to apply this configuration to.'
            attribute_mappings: '- (Optional) A map of attribute mappings applied during user reconciliation when a reconcile Lambda is not configured. Each key is the FusionAuth target field path and must begin with user. or registration.. Each value is the source expression in the identity provider response payload. A dot-notated value such as email or id_token.given_name is converted to a JSON Pointer. A value that starts with / is treated as a JSON Pointer as-is. This property cannot be used with identityProvider.lambdaConfiguration.reconcileId. This property is ignored when identityProvider.linkingStrategy is LinkAnonymously. This property defaults to an empty map. Mappings that resolve to null, cannot be extracted, or cannot be written to the target field are ignored. Mappings to user.password do not set a password.'
            claim_map: '- (Optional) A map of incoming claims to User fields, User data or Registration data. The key of the map is the incoming claim name from the configured identity provider. The following are allowed values: birthDate, firstName, lastName, fullName, middleName, mobilePhone, imageUrl, timezone, UserData and RegistrationData.'
            create_registration: '- (Optional) Determines if a UserRegistration is created for the User automatically or not. If a user doesn’t exist in FusionAuth and logs in through an identity provider, this boolean controls whether or not FusionAuth creates a registration for the User in the Application they are logging into.'
            debug: '- (Optional) Determines if debug is enabled for this provider. When enabled, each time this provider is invoked to reconcile a login an Event Log will be created.'
            default_key_id: '- (Optional, Deprecated) When configured this key will be used to verify the signature of the JWT when the header key defined by the headerKeyParameter property is not found in the JWT header. In most cases, the JWT header will contain the key identifier and this value will be used to resolve the correct public key or X.509 certificate to verify the signature. This assumes the public key or X.509 certificate has already been imported using the Key API or Key Master in the FusionAuth admin UI. In version 1.69.0 and above, use verification_key_ids instead. This field will continue to be populated with the first entry in verification_key_ids for backward compatibility, so removing it from your configuration no longer clears it. Set verification_key_ids instead. Conflicts with verification_key_ids. FusionAuth 1.69.0 and above require at least one of default_key_id or verification_key_ids; earlier versions accept neither being set. See the 1.69.0 Key Configuration Migration Guide.'
            domains: '- (Optional) An array of domains that are managed by this Identity Provider.'
            enabled: '- (Optional) Determines if this identity provider is enabled for the Application specified by the applicationId key.'
            header_key_parameter: '- (Required) The name header claim that identifies the public key used to verify the signature. In most cases this be kid or x5t.'
            idp_id: '- (Optional) The ID to use for the new identity provider. If not specified a secure random UUID will be generated.'
            lambda_reconcile_id: '- (Optional) The unique Id of the lambda to used during the user reconcile process to map custom claims from the external identity provider to the FusionAuth user.'
            limit_user_link_count_enabled: '- (Optional) When enabled, the number of identity provider links a user may create is enforced by maximumLinks.'
            limit_user_link_count_maximum_links: '- (Optional) Determines if this provider is enabled. If it is false then it will be disabled globally.'
            linking_strategy: '- (Optional) The linking strategy to use when creating the link between the {idp_display_name} Identity Provider and the user. To change the linking strategy for an enabled identity provider, disable the provider, make your change, then re-enable the provider.'
            name: '- (Required) The name of the Identity Provider.'
            oauth2_authorization_endpoint: '- (Optional) The authorization endpoint for this Identity Provider. This value is not utilized by FusionAuth is only provided to be returned by the Lookup Identity Provider API response. During integration you may then utilize this value to perform the browser redirect to the OAuth2 authorize endpoint.'
            oauth2_email_claim: '- (Optional) The name of the claim that contains the user''s email address. This will only be used when the linking_strategyis equal to LinkByEmail or LinkByEmailForExistingUser.'
            oauth2_email_verified_claim: '- (Optional) The name of the claim that identities if the user''s email address has been verified. When the linking_strategy is equal to LinkByEmail or LinkByEmailForExistingUser and this claim is present and the value is false a link will not be established and an error will be returned indicating a link cannot be established using an unverified email address.'
            oauth2_token_endpoint: '- (Optional) The token endpoint for this Identity Provider. This value is not utilized by FusionAuth is only provided to be returned by the Lookup Identity Provider API response. During integration you may then utilize this value to complete the OAuth2 grant workflow.'
            oauth2_unique_id_claim: '- (Optional) The name of the claim that contains the user''s unique user Id.'
            oauth2_username_claim: '- (Optional) The name of the claim that contains the user''s username. This will only be used when the linking_strategy is equal to LinkByUsername or LinkByUsernameForExistingUser.'
            source: '- (Optional) The source of this Identity Provider. The maximum length is 191 characters. This value is only used on create. If updated, a new Identity Provider will be created.'
            tenant_configuration: '- (Optional) The configuration for each Tenant that limits the number of links a user may have for a particular identity provider.'
            tenant_id: '- (Optional) The unique Id of the tenant that this configuration applies to.'
            unique_identity_claim: '- (Deprecated) (Optional) The name of the claim that represents the unique identify of the User. This will generally be email or the name of the claim that provides the email address.'
            verification_key_ids: '- (Optional) These keys will be used to verify the signature of the JWT. In most cases, the JWT header will contain the key identifier and this value will be used to resolve the correct key to verify the signature but that key must be in this list. This assumes the key has already been imported using the Key API or Key Master in the FusionAuth admin UI. The first entry is used when the header key defined by header_key_parameter is not found in the JWT header. Conflicts with default_key_id. FusionAuth 1.69.0 and above require at least one of default_key_id or verification_key_ids. Requires FusionAuth 1.69.0 or later.'
        importStatements: []
