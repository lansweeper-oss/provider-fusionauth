                    type: string
                  data:
                    description: |-
                      A JSON string that can hold any information about the Theme that should be persisted.
                      An object that can hold any information about the Theme that should be persisted. Please review the limits on data field types as you plan for and build your custom data schema. Must be a JSON string.
                    type: string
                  defaultMessages:
                    description: |-
                      A properties file formatted String containing at least all of the message keys defined in the FusionAuth shipped messages file.
                      A properties file formatted String containing at least all of the message keys defined in the FusionAuth shipped messages file. Required if not copying an existing Theme.
