---
apiVersion: v1
kind: Secret
metadata:
  name: fusionauth-credentials
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    {
      "host": "https://fusionauth.example.com",
      "api_key": "your-api-key-here"
    }
---
apiVersion: fusionauth.m.crossplane.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: crossplane-system
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: fusionauth-credentials
      key: credentials
