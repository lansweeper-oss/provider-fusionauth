apiVersion: idp.fusionauth.m.crossplane.io/v1alpha1
kind: Linkedin
metadata:
  annotations:
    meta.upbound.io/example-id: idp/v1alpha1/linkedin
  labels:
    testing.upbound.io/example-name: linkedin
  name: linkedin
  namespace: crossplane-system
spec:
  forProvider:
    applicationConfiguration:
    - applicationIdSelector:
        matchLabels:
          testing.upbound.io/example-name: myapp
      createRegistration: true
      enabled: true
    buttonText: Login with LinkedIn
    clientId: "9876543210"
    clientSecretSecretRef:
      key: example-key
      name: example-secret
    debug: false
    enabled: true
    scope: r_emailaddress r_liteprofile
