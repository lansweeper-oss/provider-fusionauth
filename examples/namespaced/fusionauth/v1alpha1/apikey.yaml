apiVersion: fusionauth.m.crossplane.io/v1alpha1
kind: APIKey
metadata:
  annotations:
    meta.upbound.io/example-id: fusionauth/v1alpha1/apikey
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    description: my super secret key
    keySecretRef:
      key: example-key
      name: example-secret
    permissionsEndpoints:
    - delete: true
      endpoint: /api/application
      get: true
      patch: true
      post: true
      put: true
    tenantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
